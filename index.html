<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Крипто-Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .hidden { display: none; }
        input { padding: 12px; margin: 8px; width: 80%; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        button { padding: 12px 24px; font-size: 18px; margin-top: 10px; border-radius: 8px; border: none; background: #2ea6ff; color: white; font-weight: bold; }
        .profile-card { background: #222; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .balance { font-size: 32px; font-weight: bold; color: #4caf50; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Вход -->
    <div id="loginScreen">
        <h1>Login</h1>
        <input type="text" id="username" placeholder="Login">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="login()">Log in</button>
    </div>

    <!-- ЭКРАН 2: Профиль (скрыт по умолчанию) -->
    <div id="profileScreen" class="hidden">
        <h1>Personal account</h1>
        <div class="profile-card">
            <p>User: <b id="userNameDisplay"></b></p>
            <p>Your balance:</p>
            <div class="balance">0.00 USDT</div>
            <p>~ $350,000</p>
        </div>
        <button onclick="logout()" style="background: #ff4444; margin-top: 20px;">Log out</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Функция входа
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === "" || pass === "") {
                    Telegram.WebApp.showAlert("Fill in the login and password!");
                return;
            }

            // Пока просто прячем экран входа и показываем профиль
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = user;
            
            Telegram.WebApp.showAlert("Добро пожаловать, " + user + "!");
        }

        // Функция выхода
        function logout() {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }
    </script>
</body>
</html>
