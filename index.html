<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Крипто-Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .hidden { display: none; }
        input { padding: 12px; margin: 8px; width: 80%; border-radius: 8px; border: 1px solid #333; background: #222;50 color: white; }
        button { padding: 12px; margin 24px; font-size: 18px; margin-top: 10px; border-radius: 8px; border: none; background: #2ea6ff; color: white; font-weight: bold; }
        .profile-card { background: #222; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .balance { font-size: 32px; font-weight: bold; color: #4caf: 10px 0; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h1>Вход в систему</h1>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <br>
        <button onclick="login()">Войти</button>
    </div>

    <div id="profileScreen" class="hidden">
        <h1>Личный кабинет</h1>
        <div class="profile-card">
            <p>Пользователь: <b id="userNameDisplay"></b></p>
            <p>Ваш баланс:</p>
            <div class="balance">5.42 BTC</div>
            <p>~ $350,000</p>
        </div>

        <div class="profile-card">
            <h3>Вывести средства</h3>
            <input type="number" id="withdrawAmount" placeholder="Сумма USDT">
            <input type="text" id="withdrawWallet" placeholder="Адрес кошелька">
            <button onclick="requestWithdraw()">Отправить заявку</button>
            <p id="withdrawStatus" style="color: #888; font-size: 14px;"></p>
        </div><div class="profile-card">
            <h3>Мои заявки</h3>
            <button onclick="checkStatus()">🔄 Проверить статус</button>
            <div id="requestsList" style="margin-top: 15px; text-align: left;"></div>
        </div>

        <button onclick="logout()" style="background: #ff4444; margin-top: 20px;">Выйти</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === "" || pass === "") {
                Telegram.WebApp.showAlert("Заполни логин и пароль!");
                return;
            }
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = user;
        }

        function logout() {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        async function requestWithdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            const wallet = document.getElementById('withdrawWallet').value;
            const statusEl = document.getElementById('withdrawStatus');

            if (!amount || !wallet) {
                Telegram.WebApp.showAlert("Заполни сумму и адрес кошелька!");
                return;
            }

            statusEl.textContent = "Отправка...";

            // Получаем ID пользователя из Telegram (или ставим заглушку для браузера)
            const tgUser = Telegram.WebApp.initDataUnsafe?.user;
            const userId = tgUser ? tgUser.id : "test_user";

            try {
                const response = await fetch("https://wblwgbfvqliukxerikqf.supabase.co/functions/v1/telegram-notify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        amount: amount, 
                        wallet: wallet 
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    statusEl.textContent = "✅ Заявка отправлена! Жди подтверждения.";
                    document.getElementById('withdrawAmount').value = "";
                    document.getElementById('withdrawWallet').value = "";
                } else {
                    statusEl.textContent = "❌ Ошибка: " + (data.description || "неизвестно");
                }
            } catch (err) {
                statusEl.textContent = "❌ Ошибка сети: " + err.message;
            }
        }
    async function checkStatus() {
            const listEl = document.getElementById('requestsList');
            listEl.innerHTML = "Загрузка...";

            const tgUser = Telegram.WebApp.initDataUnsafe?.user;
            const userId = tgUser ? tgUser.id : "test_user";

            try {
                const response = await fetch("https://wblwgbfvqliukxerikqf.supabase.co/functions/v1/check-status", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId })
                });

                const data = await response.json();

                if (!data.ok || !data.requests || data.requests.length === 0) {
                    listEl.innerHTML = "<p style='color:#888;'>Заявок пока нет.</p>";
                    return;
                }

                let html = "";
                data.requests.forEach(r => {
                    let color = "#ffc107";
                    let icon = "⏳";
                    if (r.status === "approved") { color = "#4caf50"; icon = "✅"; }
                    if (r.status === "rejected") { color = "#ff4444"; icon = "❌"; }
                    
                    html += `
                        <div style="background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:8px; border-left:4px solid ${color};">
                            <b>${icon} ${r.amount} USDT</b><br>
                            <span style="font-size:12px; color:#888;">Кошелек: ${r.wallet}</span><br>
                            <span style="font-size:12px; color:${color};">Статус: ${r.status}</span>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

            } catch (err) {
                listEl.innerHTML = "<p style='color:#ff4444;'>Ошибка: " + err.message + "</p>";
            }
        }</script>
</body>
</html>
