<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё первое Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 12px 24px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Привет! App</h1>
    <p id="userInfo">Загрузка...</p>
    <button onclick="Telegram.WebApp.showAlert('Ты нажал кнопку!')">Нажми меня</button>

    <script>
        // Инициализация
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Показать имя пользователя
        const user = Telegram.WebApp.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userInfo').textContent = `Привет, ${user.first_name}!`;
        } else {
            document.getElementById('userInfo').textContent = 'Открой это внутри Telegram';
        }
    </script>
</body>
</html>
